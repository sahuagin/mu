# Architecture invariants as mechanically checkable violation SHAPES.
# Audited by the installed `invariant-audit` binary from agent_tools (`just
# invariants` / `just invariants-report`; the tool's README documents the
# schema, incl. `skip_cfg_test` for Rust content shapes). Each entry names the
# rule (quote AGENTS.md), where to look, what a violation looks like, and
# `baseline` = the number of sites the repo has today.
# The audit lists EVERY site and fails when a count rises; lower the baseline in
# the PR that removes sites. Baselines only go down, and are pinned to BASE (main).
# An entry present at BASE may not be deleted outright: mark it `retired = true` first.
# Gated: scripts/pre-pr-check.sh runs the audit (`just check` / `just ci-aipr`).
# bead: mu-invariant-audit-ratchet-8vfks

[settings]
exclude = [".git/**", ".jj/**", "target/**"]

[[invariant]]
id = "providers-standalone"
rule = "providers/mu-anthropic and providers/mu-openai are standalone wire-protocol crates with no mu-core dependency (AGENTS.md → Workspace layout)"
# The manifests are parsed, not grepped: any dependency keyed or renamed
# (package = "mu-core") to the crate, in [dependencies], [dev-dependencies],
# [build-dependencies] or a target-specific table, is a site. Quoting and
# comments cannot hide or fake one.
kind = "cargo-dependency"
paths = ["crates/providers/mu-anthropic/Cargo.toml", "crates/providers/mu-openai/Cargo.toml"]
crate = "mu-core"
baseline = 0

[[invariant]]
id = "design-docs-live-in-specs"
rule = "Deep design lives in specs/ (architecture/, the mu-NNN specs, plans/); new design docs go there, not under crates/ (AGENTS.md → Architecture invariants #4)"
kind = "path"
paths = ["crates/**/*.md"]
# README/CHANGELOG/AGENTS/LICENSE are crate-facing, and specifications/ holds the
# vendored upstream API docs the provider crates are written against — not our design.
exclude = ["**/README.md", "**/CHANGELOG.md", "**/AGENTS.md", "**/LICENSE*", "**/specifications/**"]
# Recorded debt, found by the audit's first runs — design docs living under crates/:
#   crates/providers/mu-anthropic/INTEGRATION.md
#   crates/providers/mu-openai/INTEGRATION.md
#   crates/t4c/docs/help-ai-standard.md
# Move them under specs/ and lower this number in the same PR.
baseline = 3

[[invariant]]
id = "rate-cards-are-config"
rule = "Provider/model choices and their prices are CONFIG, not literals: a rate card lives in the model catalog (models.default.toml < generated < ~/.config/mu/models.toml), never in a Rust table (AGENTS.md → Model selection; mu-1x0ze). A per-token price written into Rust would have to be rebuilt to change and should never pass the gate."
kind = "content"
paths = ["crates/**/*.rs"]
# A numeric literal assigned to a per-MTok rate, a cache read/write ratio, or
# a long-context multiplier/threshold — i.e. a card constructed from numbers
# in code rather than from the catalog. Field ACCESS (`card.input_per_mtok`)
# and catalog loading (`input_per_mtok: card.input_per_mtok`) do not match.
pattern = '\b(input_per_mtok|output_per_mtok|cache_read_ratio|cache_write_5m_ratio|cache_write_1h_ratio|input_mult|output_mult|prompt_threshold)\s*:\s*[0-9]'
# Tests build cards from numbers on purpose (the arithmetic is what they test).
skip_cfg_test = true
baseline = 0
