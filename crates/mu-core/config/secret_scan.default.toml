# secret_scan built-in rules (mu-09z5y part 3). Embedded in the binary; an
# operator file (~/.config/mu/secret_scan.toml) layers on top: a [[format]]
# with the same id replaces the built-in one, `enabled = false` turns a rule
# off, and a new id adds a rule. See mu_core::secret_scan.
#
# These are the KNOWN-FORMAT rules: credentials with a recognizable shape.
# They catch what no structural check can, such as a secret embedded in a
# URL path. The list is deliberately short and hand-written (decided
# 2026-10-15). Add a rule when the archive replay shows a format in use that
# isn't covered.

[[format]]
id = "aws-access-key-id"
pattern = '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'

[[format]]
id = "github-token"
pattern = '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b'

[[format]]
id = "github-fine-grained-pat"
pattern = '\bgithub_pat_[A-Za-z0-9_]{22,}'

[[format]]
id = "slack-token"
pattern = '\bxox[abposr]-[A-Za-z0-9-]{10,}'

[[format]]
id = "slack-webhook"
pattern = 'hooks\.slack\.com/services/[A-Za-z0-9]+/[A-Za-z0-9]+/[A-Za-z0-9]+'

[[format]]
id = "api-key-sk"
# sk-..., sk-ant-..., sk-proj-..., sk-or-v1-... style provider keys
pattern = '\bsk-[A-Za-z0-9_-]{20,}'

[[format]]
id = "google-api-key"
pattern = '\bAIza[0-9A-Za-z_-]{35}'

[[format]]
id = "stripe-live-key"
pattern = '\b(?:sk|rk)_live_[0-9A-Za-z]{20,}'

[[format]]
id = "jwt"
pattern = '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'

[[format]]
id = "private-key-block"
pattern = '-----BEGIN (?:[A-Z]+ )*PRIVATE KEY-----'

# Long random-looking tokens: a lower-confidence catch-all. A token counts
# only if it's at least min_len characters of the base64/url-safe alphabet,
# mixes upper case, lower case and digits, isn't pure hex (git SHAs and
# checksums are hex), has an unbroken run of at least min_run characters
# between the separators / - _ = (paths and VAR=/path/<uuid> don't; keys
# do), and has at least min_bits_per_char of Shannon entropy.
#
# min_run was set from the archive replay: before it, 3,867 of 3,876
# high-entropy hits were scratchpad paths with a UUID in them, and only 3
# had a run of 20 or more. Url-safe keys broken into short runs by many
# separators will be missed; the known-format rules cover the common ones.
[entropy]
enabled = true
min_len = 32
min_run = 20
min_bits_per_char = 4.3
# Random-but-not-secret ID formats, removed before the entropy check. In the
# archive replay these were most of the remaining high-entropy hits: Claude
# Code session links (`claude.ai/code/session_01…`, 79 of 103) and tool-call
# ids in task-output paths (`…/tasks/toolu_01….output`). The session rule
# needs Anthropic's `01` id prefix, so a session TOKEN of another shape still
# counts. An operator [entropy] ignore list replaces this one.
ignore = [
  '\bsession_01[A-Za-z0-9]{20,}',
  '\btoolu_[A-Za-z0-9]{20,}',
  '\bmsg_[A-Za-z0-9]{20,}',
  '\breq_[A-Za-z0-9]{20,}',
  '\bcall_[A-Za-z0-9]{20,}',
  '\bchatcmpl-[A-Za-z0-9]{20,}',
]

# The names the structural detectors look for. A later layer's list REPLACES
# this one (it doesn't add to it), so an operator file that changes a list
# must repeat the entries it wants to keep. Variable names are matched
# case-insensitively, with `-` counting as `_`.
[names]
# A name is secret if it IS one of these or ENDS in `_` plus one
# (`API_KEY`, `GH_TOKEN`, `password`).
secret_words = [
  "KEY", "TOKEN", "SECRET", "PASSWORD", "PASSWD", "PASS",
  "CREDENTIAL", "CREDENTIALS", "COOKIE",
]
# ...or if one of its `_`-separated parts is one of these
# (`MU_AUTH_HEADER`, `GITHUB_OAUTH_X`)...
auth_parts = ["AUTH", "OAUTH", "AUTHORIZATION", "AUTHORISATION", "AUTHZ", "AUTHN"]
# ...or ends in one of these (`BASICAUTH`, `PROXYAUTH`).
auth_part_suffixes = ["AUTH"]
# Secret names the rules above miss. Narrowed from AWS_* in the replay:
# AWS_PROFILE and AWS_REGION are not secrets.
known_secret_names = ["AWS_ACCESS_KEY_ID"]
# A secret-named variable ending in one of these holds a FILE location, so a
# path value (`MU_SSH_KEY=$HOME/.ssh/id`) is where the secret is kept, not
# the secret. Suffixes only: `SSH_PASSWORD` or `CERT_PASSWORD` hold a
# password whatever else is in the name. A leading `_` is added if missing,
# and `_SSH_KEY` matches `SSH_KEY` itself.
file_suffixes = [
  "_FILE", "_PATH", "_DIR", "_SOCK", "_CREDENTIALS", "_KEYFILE",
  "_CERT", "_PEM", "_SSH_KEY",
]
# Commands whose `-u`/`--user user:pw` is a basic-auth password, and whose
# attached `-pSECRET` is a password. Elsewhere those flags mean other things.
# Matched as written; neither list may be empty.
http_clients = ["curl", "wget", "http", "https"]
mysql_clients = ["mysql", "mariadb", "mysqldump"]
