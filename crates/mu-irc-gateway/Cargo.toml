[package]
name = "mu-irc-gateway"
description = "Standalone single-nick IRC frontend to the mu agent mesh (v0)."
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Increments 2a-3 are the offline capability library: configuration + mapping +
# framing; the registration/capability adapter state machine, membership, and
# mesh→IRC routing; IRC→mesh routing with both loop guards. The integration
# increment adds what actually touches the network — a TLS line transport, the
# bridge that executes those decisions over it, and the daemon that runs it.
[lib]
name = "mu_irc_gateway"
path = "src/lib.rs"

[[bin]]
name = "mu-irc-gateway"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# Deterministic channel-tail hashing (a stable short hash when the full alias
# would exceed CHANNELLEN). blake3 is already a workspace dependency.
blake3 = { workspace = true }
# SASL PLAIN response encoding for the offline adapter's registration state
# machine (base64 of the `authzid \0 authcid \0 password` frame). Same workspace
# crate the mesh client already uses for biscuit capability bytes.
base64 = { workspace = true }
# The shared peer identity type — the SAME one the mesh addresses with, so a
# human folded here derives the same DM subject the daemon already routes.
mu-peer = { workspace = true }
# The shared mesh client library: increment 2a reuses `mesh::load` /
# `MeshConfig` for mesh-config loading rather than re-implementing it. No IRC
# client dependency lands here — that arrives with the 2b adapter.
mu-dialogue = { path = "../mu-dialogue" }
# The issuer public-key type at the routing ingress boundary: mesh→IRC reception
# runs the SAME fail-closed `mesh::verify_and_decode_dm` the daemon does, which
# takes a biscuit `PublicKey`. No new verification is introduced here.
biscuit-auth = { workspace = true }

# ── integration increment ───────────────────────────────────────────────────
# The async runtime the bridge runs on. `full` matches the workspace default;
# the gateway uses net, time, sync, signal and the multi-thread runtime.
tokio = { workspace = true }
# The IRC socket. Deliberately NOT an IRC client crate: the adapter already owns
# registration/CAP/SASL, and every maintained client wants to own that handshake
# itself. What is missing is a TLS line transport, which is these two.
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# The bridge's error plumbing, and the binary's CLI.
anyhow = { workspace = true }
clap = { workspace = true }
# Body-free operational logging (never a message body, never a credential).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The routing ingress test mints a real capability-signed `DmEnvelope` and
# serializes it, to prove the fail-closed gate accepts a valid one and rejects a
# tampered or wrongly-signed one — exercising `mesh::verify_and_decode_dm` for
# real, not a stub.
serde_json = { workspace = true }
# The transport's `start_paused` tests (the bounded shutdown grace, the shared
# connect budget) drive tokio's clock instead of waiting those windows out in
# real time. `test-util` is NOT part of the workspace `full` feature, so the
# crate that uses it has to ask for it here — otherwise `cargo test -p
# mu-irc-gateway` compiles only when some other crate in the build happens to
# unify the feature in.
tokio = { workspace = true, features = ["test-util"] }
