[package]
name = "mu-peer"
description = "The dialogue/mesh peer identity type — one place that parses and renders `role:id[:sub]`."
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Deliberately a LEAF crate: mu-dialogue is dependency-light on purpose and
# does not depend on mu-core, so the shared identity type cannot live there
# (mu-uto4). serde is the only dep, and only for the string round trip.
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
