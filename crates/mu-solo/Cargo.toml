[package]
name = "mu-solo"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
description = "Standalone single-pane chat TUI for mu serve — claude-code-inspired UX, library + main split, intentionally small."

# Library half: exposes App, Client, Render so they can be used by other
# binaries or tested independently.
[lib]
name = "mu_solo"
path = "src/lib.rs"

# Binary half: thin wrapper that wires lib together.
[[bin]]
name = "mu-solo"
path = "src/bin/mu-solo.rs"

[dependencies]
mu-core = { path = "../mu-core" }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
# Layered config: defaults < ~/.config/mu/solo.toml < env (MU_SOLO_) < CLI.
# TUI-local keys land in App state; session-bound keys forward to `mu serve`
# (flags) and `create_session` (params). See src/config.rs for the split.
figment = { version = "0.10", features = ["toml", "env"] }
# `dirs` resolves XDG config / home paths cross-platform (rather than
# hand-rolling $HOME / $XDG_CONFIG_HOME). Tiny crate, transitive-light.
dirs = "5"
# mu-8stm.1: hostname via gethostname(3) (backed by the kern.hostname sysctl on
# BSD) — one syscall, cached once, instead of fork+exec'ing `hostname` per frame.
gethostname = "1"
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
ansi-to-tui = "8"
serde_yaml = { workspace = true }
toml = { workspace = true }
arboard = { version = "3.6.1", default-features = false }
# Display-width-aware clipping in the log window (already transitive via
# ratatui; same version).
unicode-width = "0.2"

# Deterministic viewport scenario driver for the pty screen-scrape test
# (mu-8oqp) — a miniature in-repo mu-vt-probe. Normal deps only.
[[bin]]
name = "vt-scenario"
path = "src/bin/vt-scenario.rs"

[dev-dependencies]
# Screen-scrape validation (mu-8oqp): an INDEPENDENT terminal model. Two
# prior fixes in this bug family were green on their own bookkeeping tests
# and wrong on the real screen; asserting through vt100 breaks that loop.
vt100 = "0.15"
nix = { version = "0.29.0", features = ["term", "poll"] }
