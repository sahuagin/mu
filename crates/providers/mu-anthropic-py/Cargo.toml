[package]
name = "mu-anthropic-py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mu_anthropic_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
mu-anthropic = { path = "../mu-anthropic" }
pyo3 = { version = "0.25", features = ["extension-module"] }
# serde Serializer that emits native Python objects (dict/list/int/str/...)
# straight from a typed value — no JSON string in between. pyo3 + serde only;
# NO polars/pandas/scipy/numpy (mu-anthropic AGENTS.md rule 8). Version tracks
# pyo3's minor (0.25 ↔ pyo3 0.25).
pythonize = "0.25"
serde_json = "1"

[features]
# default off so a plain `cargo build --workspace` doesn't require a python lib
extension-module = ["pyo3/extension-module"]
