# NATS broker for the mu agent mesh.
#
# Install (FreeBSD, on the host that runs the mesh):
#   sudo pkg install nats-server
#   # pkg materialises /usr/local/etc/nats.conf from its own nats.conf.sample.
#   # EDIT THAT FILE — do not overwrite it with this one, which is a reference
#   # for the two settings that matter, not a drop-in replacement.
#   sudo vi /usr/local/etc/nats.conf     # set listen: as below
#   sudo sysrc nats_enable="YES"
#   sudo service nats start
#
# Verify the bind before touching any client config — this is the step whose
# absence cost the most time on 2026-08-10:
#   sockstat -46l | grep 4222     # want *:4222 (tcp46), not one specific address
#
# The port ships its own rc.d script (`service nats ...`, knobs nats_enable /
# nats_user / nats_group / nats_options) and runs as the dedicated `nats` user.
# Do not hand-roll a service for this; the port's one also wires up reload,
# logrotate and ldm signal handling.
#
# WHY 0.0.0.0 AND NOT localhost (the port's default), NOR a specific address:
# the mesh spans hosts. mu-dialogue's gateway, the mu daemons and the cc jail
# are not all on one box, so a loopback bind makes the broker unreachable to
# every participant but one. That cost a long session on 2026-08-10.
#
# A SPECIFIC address (listen: 10.1.1.172:4222) is the subtler trap: it serves
# that address and nothing else, so 127.0.0.1:4222 is refused ON THAT SAME HOST.
# Any config anywhere still naming loopback then fails, and the error looks like
# a config problem rather than a bind problem. 0.0.0.0 binds a dual-stack
# wildcard (tcp46 — it covers IPv6 too; [::] is equivalent here), so every
# address for this host works and a stray loopback value still connects.
listen: 0.0.0.0:4222

# Monitoring stays loopback — it is a diagnostic surface, not a mesh surface.
http: localhost:8222

syslog: true

# JetStream is deliberately NOT enabled. Mesh dialogue is core NATS pub/sub:
# DMs are fire-and-forget and the mu-dialogue SQLite store is the durable
# buffer (at-uws). The only JetStream user in this tree is mesh-slice's test
# harness, which spawns its own throwaway server. Enabling it here would add a
# store to manage and back up for nothing.
#
# jetstream {
#   store_dir: /var/db/nats
# }

# NOTE ON EXPOSURE: this is an unauthenticated broker on the LAN. DM envelopes
# carry per-message biscuit capabilities, so a stranger cannot forge a DM that
# any peer will accept — but $SRV discovery and raw subject traffic are open to
# anything that can reach the port. That is a deliberate trusted-network
# posture, not an oversight. Add `authorization { ... }` here if that stops
# being true.
